[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-observatory"
version = "0.1.0"
description = "Reproducible paired-pod environmental anomaly research prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
observatory = "anomaly_observatory.cli:main"

[tool.setuptools.packages.find]
include = ["anomaly_observatory*"]
